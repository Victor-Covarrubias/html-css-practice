<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox Practice</title>
    </head>
    <body style="padding-bottom: 1000px;">
        <div style="
            display: flex;
            flex-direction: row;
            ">
            <!--
            with flex the divs dont act as block elements enymore they just 
            take as much space as they need to, compared to grid we dont 
            need to set the columns, they are also vertical aligned

            Its better to use flexbox when u have elements that change
            grid=rigid layout
            flex=flexible layout
            -->
            <div style="background-color: lightblue;">div 1 text</div>
            <div style="background-color: lightpink;">div 2 <p>text</p></div>
        </div>

        <div style="
            margin-top: 30px;
            display: flex;
            flex-direction: row;
            ">
            <div style="
            background-color: lightblue;
            width: 100px;
            ">100px</div>
            <div style="
            background-color: lightpink;
            flex: 1;
            ">div 2 <p>flex: 1</p></div>
        </div>

        <div style="
            margin-top: 30px;
            display: flex;
            flex-direction: row;
            ">
            <div style="
            background-color: lightblue;
            width: 100px;
            ">100px</div>
            <div style="
            background-color: lightpink;
            flex: 1;
            ">flex: 1</div>
            <div style="
            background-color: lightblue;
            flex: 2;
            ">flex: 2</div>
        </div>

        <div style="
            margin-top: 30px;
            height: 70px;
            border-width: 1px;
            border-style: solid;
            border-color: gray;
            display: flex;
            flex-direction: row;
            /*
            justify changes the alignment of the flex display
            default: start
            */
            justify-content: center;
            ">
            <div style="
            background-color: lightblue;
            width: 100px;
            ">100px</div>
            <div style="
            background-color: lightpink;
            width: 100px;
            ">100px</div>
            <div style="
            background-color: lightblue;
            width: 100px;
            ">100px</div>
        </div>

        <div style="
            margin-top: 30px;
            height: 70px;
            border-width: 1px;
            border-style: solid;
            border-color: gray;
            display: flex;
            flex-direction: row;
            /*
            justify space between spreads the elments evenly across the flex
            */
            justify-content: space-between;
            ">
            <div style="
            background-color: lightblue;
            width: 100px;
            ">100px</div>
            <div style="
            background-color: lightpink;
            width: 100px;
            ">100px</div>
            <div style="
            background-color: lightblue;
            width: 100px;
            ">100px</div>
        </div>

        <div style="
            margin-top: 30px;
            height: 70px;
            border-width: 1px;
            border-style: solid;
            border-color: gray;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            /*
            align-items default values is stretching wich 
            makes the elements stretch verticaly, with start they just align to the top, we
            can also place them in the end and in the center (bottom and center)
            */
            align-items: center;
            ">
            <div style="
            background-color: lightblue;
            width: 100px;
            ">100px</div>
            <div style="
            background-color: lightpink;
            width: 100px;
            ">100px</div>
            <div style="
            background-color: lightblue;
            width: 100px;
            ">100px</div>
        </div>
        
    </body>
</html>
