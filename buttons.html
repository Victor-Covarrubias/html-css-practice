<style>
    /* button = CSS Selector (element we are targeting*/
    .subscribe-button{
        /* CSS property (background) : CSS value*/
        background-color: rgb(201, 0, 0);
        color: white;
        border: none;
        height: 35px;
        width: 105px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
        transition:opacity 0.15s;
    }

    /*pseudo class*/
    .subscribe-button:hover{
        /*background-color: green;*/
        opacity: 0.8;
    }
    /*pseudo class*/
    .subscribe-button:active{
        opacity: 0.4;
    }

    .join-button{
        /* CSS property (background) : CSS value*/
        background-color: white;
        border-color: rgb(50, 115, 213);
        border-style: solid;
        border-width: 1px;
        color: rgb(50, 115, 213);
        height: 35px;
        width: 60px;
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 1s, color 1s;
    }

    .join-button:hover{
        background-color: rgb(50, 115, 213);
        color: white;
    }

    .join-button:active{
        opacity: 0.7;
    }

    .tweet-button{
        /* CSS property (background) : CSS value*/
        background-color: rgb(0, 149, 255);
        color: white;
        border: none;
        height: 35px;
        width: 75px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-left: 8px;
        transition: box-shadow 0.15s;
    }

    .tweet-button:hover{
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
    }
</style>

<!-- Class atribute to just modify some elements-->
<button class="subscribe-button">
    Subscribe
</button>

<button class="join-button">
    JOIN
</button>

<button class="tweet-button">
    Tweet
</button>
