<style>
    
    /* button = CSS Selector (element we are targeting*/
    .subscribe-button{
        /* CSS property (background) : CSS value*/
        background-color: rgb(201, 0, 0);
        color: white;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
        margin-left: 20px;
       /*height: 35px;
        width: 105px;*/
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
        transition:opacity 0.15s;
        /*by default the browser tries to align the elements in this case the button by the text*/
        vertical-align: top;
    }

    /*pseudo class*/
    .subscribe-button:hover{
        /*background-color: green;*/
        opacity: 0.8;
    }
    /*pseudo class*/
    .subscribe-button:active{
        opacity: 0.4;
    }

    .join-button{
        /*box model | margin = ouside space, padding = inside space*/
        /*how far it is from other elements and how much space it takes up in the page*/
        background-color: white;
        border-color: rgb(50, 115, 213);
        border-style: solid;
        border-width: 1px;
        color: rgb(50, 115, 213);
        /*height: 35px;
        width: 60px;*/
        /*the margin was givin an extra pixel so i educed the padding*/
        padding-top: 9px;
        padding-bottom: 9px;
        padding-left: 16px;
        padding-right: 16px;
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 1s, color 1s;
    }

    .join-button:hover{
        background-color: rgb(50, 115, 213);
        color: white;
    }

    .join-button:active{
        opacity: 0.7;
    }

    .tweet-button{
        /* CSS property (background) : CSS value*/
        background-color: rgb(0, 149, 255);
        color: white;
        border: none;
        padding-top: 9px;
        padding-bottom: 9px;
        padding-left: 16px;
        padding-right: 16px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-left: 8px;
        transition: box-shadow 0.15s;
        vertical-align: top;
    }

    .tweet-button:hover{
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
    }
</style>

<!-- Class atribute to just modify some elements-->
<button class="subscribe-button">
    Subscribe
</button>

<button class="join-button">
    JOIN
</button>

<button class="tweet-button">
    Tweet
</button>
