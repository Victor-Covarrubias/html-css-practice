<style>
    /* button = CSS Selector (element we are targeting*/
    .subscribe-button{
        /* CSS property (background) : CSS value*/
        background-color: rgb(201, 0, 0);
        color: white;
        border: none;
        height: 35px;
        width: 105px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
    }

    .join-button{
        /* CSS property (background) : CSS value*/
        background-color: white;
        border-color: rgb(50, 115, 213);
        border-style: solid;

        color: rgb(50, 115, 213);
        height: 35px;
        width: 60px;
        border-radius: 2px;
        cursor: pointer;
    }

    .tweet-button{
        /* CSS property (background) : CSS value*/
        background-color: rgb(0, 149, 255);
        color: white;
        border: none;
        height: 35px;
        width: 75px;
        border-radius: 18px;
        font-weight: bold;

</button>

</button>

</button>
