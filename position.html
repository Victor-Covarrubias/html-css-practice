<!DOCTYPE html>
<html>
    <head>
        <title>Position Practice</title>
    </head>
    <body style="
        height: 3000px;
        /*to create space so the header doesnt cover other elements*/
        padding-top: 60px;
        padding-left: 80px;
    ">
        <div style="
            background-color: black;
            color: white;
            position: fixed;
            /*
            how far is the element from the some direction of the window
            if we use opposite directions the element stretches
            */
            top: 0px;
            left: 0px;
            right: 0px;
            height: 50px;
        ">header</div>
        <div style="
        background-color: green;
        color: white;
        position: fixed;
        left: 0px;
        bottom: 0px;
        top: 50px;
        width: 72px;
        ">
            sidebar
        </div>
        <div style="
            background-color: lightblue;
            height: 200px;
            width: 200px;
            /*position: static is the default value*/
            position: static;
        ">div 1</div>
        <div style="
            background-color: lightpink;
            height: 200px;
            width: 200px;
        ">div 2</div>
    </body>
</html>
