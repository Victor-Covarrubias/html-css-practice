<!DOCTYPE html>
<html>
    <head>
        <title>Position Practice</title>
    </head>
    <body style="
        height: 3000px;
        /*to create space so the header doesnt cover other elements*/
        padding-top: 60px;
        padding-left: 80px;
    ">
        <!--
        If we place a position absolute inside a position fixed we can put
        a element wherever we want inside the element with the position fixed
        like for examen in the corner of it.
        If the element has a position relative instead of a position fixed the
        element with the absolute position that is inside is able to move with
        the element that has the relative position because the absolute element
        is now relative to the elemenet with that position and its not relative
        to the page anymore
        -->
        <div style="
            background-color: black;
            color: white;
            position: fixed;
            /*
            how far is the element from the some direction of the window
            if we use opposite directions the element stretches
            */
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            /*
            with z index we cabn determine which elements
            appear above others the value we type is the layer
            so if its greater than another one itll appear above
            this just happens to elements without position static 
            like elements with position relative
            */
            z-index: 100;
        ">header</div>

        <div style="
        background-color: green;
        color: white;
        position: fixed;
        left: 0;
        bottom: 0;
        top: 50px;
        width: 72px;
        ">
            sidebar
            <div style="
                position: absolute;
                background-color: red;
                color: white;
                right: 0;
                top: 0;
            ">
                X
            </div>
        </div>

        <div style="
            position: absolute;
            background-color: red;
            color: white;
            right: 10px;
            top: 60px;
            /*
            this element can appear above the header
            since elements that are created below
            appear above others
            */
        ">
            absolute
        </div>

        <div style="
            background-color: lightblue;
            height: 200px;
            width: 200px;
            /*position: static is the default value*/
            position: static;
        ">div 1</div>

        <div style="
            background-color: lightpink;
            height: 200px;
            width: 200px;
            position: relative;
        ">div 2
        <div style="
            position: absolute;
            background-color: rgb(0, 0, 0);
            color: white;
            right: 10px;
            bottom: 10px;
        ">
            5:00
        </div>
    </div>
    </body>
</html>
